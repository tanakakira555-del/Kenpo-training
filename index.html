<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健康保険法 一問一答</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

:root {
  --bg: #f5f0e8;
  --surface: #ffffff;
  --surface2: #faf7f2;
  --border: #e0d8cc;
  --accent: #2d5016;
  --accent2: #8b1a1a;
  --text: #1a1a1a;
  --text2: #6b6055;
  --correct-bg: #e8f5e9;
  --correct-border: #2d5016;
  --wrong-bg: #fdecea;
  --wrong-border: #8b1a1a;
  --radius: 4px;
  --shadow: 0 1px 4px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
}

header {
  background: var(--accent);
  color: white;
  padding: 12px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.header-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.score-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  background: rgba(255,255,255,0.2);
  padding: 3px 10px;
  border-radius: 12px;
}

.progress-bar {
  height: 3px;
  background: rgba(255,255,255,0.3);
  position: relative;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: #a8d97f;
  transition: width 0.4s ease;
}

main {
  max-width: 680px;
  margin: 0 auto;
  padding: 20px 16px 60px;
}

/* フィルター */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-label {
  font-size: 11px;
  color: var(--text2);
  font-family: 'JetBrains Mono', monospace;
}

.filter-select {
  flex: 1;
  min-width: 140px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  font-family: 'Noto Serif JP', serif;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
}

.mode-btns {
  display: flex;
  gap: 4px;
}

.mode-btn {
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  color: var(--text2);
  transition: all 0.15s;
}

.mode-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* 問題カード */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.card-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text2);
}

.section-tag {
  font-size: 10px;
  padding: 2px 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 2px;
  color: var(--text2);
  letter-spacing: 0.05em;
}

.question-text {
  font-size: 14px;
  line-height: 1.9;
  color: var(--text);
  margin-bottom: 16px;
}

/* ○×ボタン */
.answer-btns {
  display: flex;
  gap: 10px;
}

.ans-btn {
  flex: 1;
  padding: 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface2);
  font-size: 22px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Noto Serif JP', serif;
}

.ans-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: #f0f5ea;
}

.ans-btn[data-val="true"]:hover:not(:disabled) {
  border-color: var(--correct-border);
  background: var(--correct-bg);
}

.ans-btn[data-val="false"]:hover:not(:disabled) {
  border-color: var(--wrong-border);
  background: var(--wrong-bg);
}

.ans-btn.correct {
  border-color: var(--correct-border);
  background: var(--correct-bg);
}

.ans-btn.wrong {
  border-color: var(--wrong-border);
  background: var(--wrong-bg);
}

.ans-btn:disabled { cursor: default; opacity: 0.7; }

/* 結果表示 */
.result-box {
  margin-top: 12px;
  padding: 14px;
  border-radius: var(--radius);
  display: none;
  font-size: 13px;
  line-height: 1.7;
}

.result-box.show { display: block; }

.result-box.correct {
  background: var(--correct-bg);
  border: 1px solid var(--correct-border);
  border-left: 4px solid var(--correct-border);
}

.result-box.wrong {
  background: var(--wrong-bg);
  border: 1px solid var(--wrong-border);
  border-left: 4px solid var(--wrong-border);
}

.result-label {
  font-weight: 700;
  margin-bottom: 6px;
  font-size: 14px;
}

.correct .result-label { color: var(--correct-border); }
.wrong .result-label { color: var(--wrong-border); }

.result-answer {
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 8px;
}

.explanation-text {
  color: var(--text);
  font-size: 13px;
}

/* ナビボタン */
.nav-btns {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.nav-btn {
  padding: 10px 20px;
  border-radius: var(--radius);
  font-family: 'Noto Serif JP', serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid;
}

.btn-next {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  flex: 1;
  font-weight: 600;
}

.btn-next:hover { opacity: 0.85; }

.btn-prev {
  background: var(--surface);
  color: var(--text2);
  border-color: var(--border);
}

.btn-prev:hover {
  border-color: var(--text2);
  color: var(--text);
}

/* 統計 */
.stats-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}

.stat {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text2);
}

.stat strong {
  color: var(--text);
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.dot-correct { background: var(--correct-border); }
.dot-wrong { background: var(--wrong-border); }
.dot-skip { background: var(--border); }

/* 完了画面 */
#complete-view {
  display: none;
  text-align: center;
  padding: 60px 0;
}

#complete-view.show { display: block; }

.complete-score {
  font-family: 'JetBrains Mono', monospace;
  font-size: 56px;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 4px;
}

.complete-label {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 8px;
}

.complete-pct {
  font-size: 24px;
  color: var(--text2);
  margin-bottom: 32px;
}

/* しおり */
.bookmark-row {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 8px;
}

.bookmark-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 3px;
  opacity: 0.5;
  transition: opacity 0.15s;
}
.bookmark-btn:hover, .bookmark-btn.active { opacity: 1; }

</style>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="社労士">
<link rel="apple-touch-icon" href="samune.png">
<meta name="theme-color" content="#0a0a0f">
</head>
<body>

<header>
  <div class="header-title">健康保険法 一問一答</div>
  <div class="header-right">
    <div class="score-badge" id="hdr-score">○ 0 / 0</div>
  </div>
</header>
<div class="progress-bar">
  <div class="progress-fill" id="prog-fill" style="width:0%"></div>
</div>

<main>

  <div class="filter-bar">
    <span class="filter-label">章：</span>
    <select class="filter-select" id="section-select" onchange="applyFilter()">
      <option value="">全章（230問）</option>
      <option value="目的等">目的等</option><option value="全国健康保険協会">全国健康保険協会</option><option value="健康保険組合">健康保険組合</option><option value="適用事業所">適用事業所</option><option value="被保険者">被保険者</option><option value="任意継続被保険者等">任意継続被保険者等</option><option value="被扶養者">被扶養者</option><option value="届出等">届出等</option><option value="療養担当者">療養担当者</option><option value="報酬・賞与">報酬・賞与</option><option value="標準報酬">標準報酬</option><option value="費用の負担">費用の負担</option><option value="療養の給付">療養の給付</option><option value="入院時食事療養費・入院時生活療養費">入院時食事療養費・入院時生活療養費</option><option value="保険外併用療養費">保険外併用療養費</option><option value="療養費">療養費</option><option value="家族療養費">家族療養費</option><option value="訪問看護療養費">訪問看護療養費</option><option value="高額療養費">高額療養費</option><option value="高額介護合算療養費">高額介護合算療養費</option><option value="移送費">移送費</option><option value="傷病手当金">傷病手当金</option><option value="出産育児一時金">出産育児一時金</option><option value="出産手当金">出産手当金</option><option value="埋葬料・埋葬費">埋葬料・埋葬費</option><option value="資格喪失後の給付">資格喪失後の給付</option><option value="給付通則">給付通則</option><option value="日雇特例被保険者">日雇特例被保険者</option><option value="時効・不服申立て等">時効・不服申立て等</option>
    </select>
    <div class="mode-btns">
      <button class="mode-btn active" onclick="setMode('all',this)">全問</button>
      <button class="mode-btn" onclick="setMode('wrong',this)">誤問</button>
      <button class="mode-btn" onclick="setMode('bookmark',this)">☆</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat"><div class="dot dot-correct"></div>正解 <strong id="stat-correct">0</strong></div>
    <div class="stat"><div class="dot dot-wrong"></div>不正解 <strong id="stat-wrong">0</strong></div>
    <div class="stat"><div class="dot dot-skip"></div>残り <strong id="stat-remain">0</strong></div>
  </div>

  <div id="question-area"></div>
  <div id="complete-view">
    <div class="complete-score" id="cmp-score"></div>
    <div class="complete-label">問中正解</div>
    <div class="complete-pct" id="cmp-pct"></div>
    <div class="nav-btns" style="justify-content:center">
      <button class="nav-btn btn-next" onclick="restart()" style="flex:none;padding:12px 32px">もう一度</button>
    </div>
  </div>

</main>

<script>
const ALL = [{"id": 1, "section": "目的等", "q": "健康保険法は、大正11年に制定され、同時に施行された日本で最初の社会保険に関する法である。", "correct": false, "exp": "施行は「昭和2年」。大正15年7月1日より一部施行、昭和2年に全面施行。[H21-1A]"}, {"id": 2, "section": "目的等", "q": "健康保険では、労働者又はその被扶養者の業務災害以外の疾病、負傷、障害若しくは死亡又は出産に関して保険給付を行う。", "correct": false, "exp": "「障害」は含まれない。正しくは「疾病、負傷若しくは死亡又は出産」に関して給付を行う。"}, {"id": 3, "section": "目的等", "q": "被保険者が副業として行う請負業務中に負傷した場合等、労働者災害補償保険の給付を受けることのできない業務上の傷病等については、原則として健康保険の給付が行われる。", "correct": true, "exp": "設問の通り正しい。労災保険の給付対象とならない業務上の傷病等には、原則として健康保険から給付される。[H28-5D]"}, {"id": 4, "section": "目的等", "q": "被保険者が5人未満である適用事業所に所属する法人の代表者は、業務遂行の過程において業務に起因して生じた傷病に関しても健康保険による保険給付の対象となる場合があるが、その対象となる業務は、当該法人における従業員が従事する業務と同一であると認められるものとされている。", "correct": true, "exp": "設問の通り正しい。[H30-10A]"}, {"id": 5, "section": "目的等", "q": "被保険者又はその被扶養者が法人の役員である場合に、その法人の役員としての業務に起因する疾病、負傷又は死亡に関しては、保険給付が行われることはない。", "correct": false, "exp": "被保険者数5人未満の適用事業所の法人役員で、従業員が従事する業務と同一と認められる業務に起因する傷病等については保険給付が行われる。"}, {"id": 6, "section": "目的等", "q": "健康保険制度は、高齢化の進展、疾病構造の変化、社会経済情勢の変化等に対応し、その他の医療保険制度及び後期高齢者医療制度並びにこれらに密接に関連する制度と併せて5年ごとに検討が加えられることになっている。", "correct": false, "exp": "「5年ごと」ではなく「常に」検討が加えられる。[H21-1C]"}, {"id": 7, "section": "全国健康保険協会", "q": "全国健康保険協会が管掌する健康保険の事業に関する業務のうち、被保険者の資格の取得及び喪失の確認、標準報酬月額及び標準賞与額の決定並びに保険料の徴収（任意継続被保険者に係るものを除く。）並びにこれらに附帯する業務は、厚生労働大臣が行う。", "correct": true, "exp": "設問の通り正しい。[H22-1A]"}, {"id": 8, "section": "全国健康保険協会", "q": "全国健康保険協会が管掌する健康保険の事業に関する業務のうち、保健事業及び福祉事業に関する業務については、厚生労働大臣が行う。", "correct": false, "exp": "保健事業及び福祉事業に関する業務は「全国健康保険協会」が行う。"}, {"id": 9, "section": "全国健康保険協会", "q": "全国健康保険協会が管掌する健康保険の事業に関する業務のうち、前期高齢者納付金等及び後期高齢者支援金等、介護納付金並びに流行初期医療確保拠出金等の納付に関する業務は、厚生労働大臣が行う。", "correct": false, "exp": "これらの業務は「全国健康保険協会」が行う。"}, {"id": 10, "section": "全国健康保険協会", "q": "全国健康保険協会に、役員として、理事長1人、理事6人以内及び監事2人を置く。理事長は、厚生労働大臣が任命し、理事及び監事は、理事長が任命する。", "correct": false, "exp": "監事は「厚生労働大臣」が任命する。理事は理事長が任命する。"}, {"id": 11, "section": "全国健康保険協会", "q": "政府又は地方公共団体の職員は、全国健康保険協会の役員となることができる。", "correct": false, "exp": "政府又は地方公共団体の職員（非常勤の者を除く）は役員となることができない。"}, {"id": 12, "section": "全国健康保険協会", "q": "全国健康保険協会は、都道府県ごとの実情に応じた業務の適正な運営に資するため、支部ごとに運営委員会を設け、当該支部における業務の実施について、運営委員会の意見を聴くものとする。", "correct": false, "exp": "「運営委員会」ではなく「評議会」が正しい。[H26-1D]"}, {"id": 13, "section": "全国健康保険協会", "q": "全国健康保険協会は、毎事業年度の決算を翌事業年度の5月31日までに完結しなければならない。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 14, "section": "全国健康保険協会", "q": "全国健康保険協会は、厚生労働省令で定める重要な財産を譲渡し、又は担保に供したときは、厚生労働大臣に報告しなければならない。", "correct": false, "exp": "「報告」ではなく「厚生労働大臣の認可を受け」なければならない。[H24-4ウ]"}, {"id": 15, "section": "全国健康保険協会", "q": "全国健康保険協会は、その業務に要する費用に充てるため必要な場合において、運営委員会の議を経て短期借入金をすることができる。その場合、理事長はあらかじめ厚生労働大臣に協議をしなければならない。", "correct": false, "exp": "「運営委員会の議を経て」ではなく「厚生労働大臣の認可を受けて」短期借入金をすることができる。[H22-3E]"}, {"id": 16, "section": "全国健康保険協会", "q": "厚生労働大臣は、全国健康保険協会の財務及び会計その他全国健康保険協会に関し必要な事項について厚生労働省令を定めようとするときは、あらかじめ、財務大臣に協議しなければならない。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 17, "section": "健康保険組合", "q": "健康保険組合は、適用事業所の事業主及びその適用事業所に使用される被保険者のみをもって組織される。", "correct": false, "exp": "任意継続被保険者（特定健康保険組合の場合は特例退職被保険者を含む）も組織に含まれる。"}, {"id": 18, "section": "健康保険組合", "q": "適用事業所の事業主は、共同して健康保険組合を設立することができるが、この場合、使用されている被保険者の数は、合算して常時3,000人以上でなければならない。", "correct": true, "exp": "設問の通り正しい。単独設立の場合は常時700人以上。"}, {"id": 19, "section": "健康保険組合", "q": "2以上の適用事業所について健康保険組合を設立しようとする場合には、それぞれの適用事業所ごとに当該事業所に使用される被保険者の2分の1以上の同意を得なければならない。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 20, "section": "健康保険組合", "q": "健康保険組合は、規約に定めてある事務所の所在地を変更したときは、遅滞なく、厚生労働大臣に届け出て認可を受けなければならない。", "correct": false, "exp": "事務所の所在地の変更は認可不要。遅滞なく厚生労働大臣に届け出ればよい。[H24-4イ]"}, {"id": 21, "section": "健康保険組合", "q": "健康保険組合は、合併しようとするときは、組合会において組合会議員の定数の3分の2以上の多数により議決し、厚生労働大臣の認可を受けなければならない。", "correct": false, "exp": "「3分の2以上」ではなく「4分の3以上」が正しい。[H25-3A]"}, {"id": 22, "section": "健康保険組合", "q": "健康保険組合がその設立事業所を増加させ、又は減少させようとするときは、その増加又は減少に係る適用事業所の事業主の全部の同意を得なければならないが、併せて、その適用事業所に使用される被保険者の2分の1以上の同意も得なければならない。", "correct": true, "exp": "設問の通り正しい。[H28-1ア]"}, {"id": 23, "section": "健康保険組合", "q": "健康保険組合が解散する場合において、その財産をもって債務を完済することができないときは、当該健康保険組合は、設立事業所の事業主及び被保険者に対し、当該債務を完済するために要する費用の全部又は一部を負担することを求めることができる。", "correct": false, "exp": "「被保険者」に対して負担を求めることはできない。「設立事業所の事業主」に対してのみ求めることができる。"}, {"id": 24, "section": "健康保険組合", "q": "健康保険組合は、毎年度、収入支出の予算を作成し、当該年度の開始前に、厚生労働大臣に届け出なければならず、これを変更したときも同様である。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 25, "section": "健康保険組合", "q": "健康保険組合は、支払上現金に不足が生じた場合において、準備金に属する現金を繰替使用し、又は一時借入金をしたときは、当該繰替使用した金額及び一時借入金は、遅くとも当該会計年度の翌会計年度内に返還しなければならない。", "correct": false, "exp": "「翌会計年度内」ではなく「当該会計年度内」に返還しなければならない。"}, {"id": 26, "section": "健康保険組合", "q": "健康保険事業の収支が均衡しない健康保険組合であって、政令で定める要件に該当するものとして厚生労働大臣の指定を受けたものは、当該指定があった日の属する年度の翌年度を初年度とする3箇年間の健全化計画を定め、厚生労働大臣の承認を受けたうえ、これに従いその事業を行わなければならない。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 27, "section": "適用事業所", "q": "健康保険法では常時5人以上の従業員を使用して適用業種を行う個人の事業所を強制適用事業所としているが、事業所における従業員の員数の算定においては、当該事業所に常時使用されている者であっても、適用除外の規定によって被保険者とすることができない者は除かれる。", "correct": false, "exp": "適用除外の規定によって被保険者となることができない者であっても、常時雇用されている者は員数の算定に含まれる。"}, {"id": 28, "section": "適用事業所", "q": "常時10人の従業員を使用している個人経営の飲食業の事業所は強制適用事業所とはならないが、常時3人の従業員を使用している法人である土木、建築等の事業所は強制適用事業所となる。", "correct": true, "exp": "飲食業は非適用業種のため個人経営は強制適用とならない。法人の事業所は業種にかかわらず、常時従業員を使用していれば強制適用事業所となる。[H23-1C]"}, {"id": 29, "section": "適用事業所", "q": "任意適用事業所に使用される者のうち、事業所の任意加入に同意しなかった者は、被保険者とならなくてもよいとされている。", "correct": false, "exp": "任意加入した事業所に使用される者は、加入に同意しなかった者も含めて被保険者となる。"}, {"id": 30, "section": "適用事業所", "q": "従業員が15人の個人経営の理髪店で、被保険者となるべき者の2分の1以上が希望した場合には、事業主に速やかに適用事業所とするべき義務が生じる。", "correct": false, "exp": "健康保険法においては、被保険者となるべき者からの希望がある場合であっても、事業主に適用事業所とすべき義務は生じない。[H24-8A]"}, {"id": 31, "section": "適用事業所", "q": "強制適用事業所が、強制適用事業所の要件に該当しなくなった場合において、当該事業所の被保険者の2分の1以上が任意適用事業所となることを希望したときは、当該事業所の事業主は改めて厚生労働大臣に任意適用の認可を申請しなければならない。", "correct": false, "exp": "要件に該当しなくなったときは、任意適用の認可があったものとみなされる（任意適用の擬制）ため、申請不要で任意適用事業所に移行する。[R5-8B]"}, {"id": 32, "section": "適用事業所", "q": "2以上の適用事業所の事業主が同一である場合には、当該事業主は、厚生労働大臣の承認を受けて、当該2以上の事業所を1つの適用事業所とすることができる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 33, "section": "適用事業所", "q": "代表者が1人の法人の事業所であって、代表者以外に従業員を雇用していないものについては、適用事業所とはならない。", "correct": false, "exp": "法人の代表者であっても法人から報酬を受けている場合は被保険者となる。常時1人以上の従業員を使用する法人は適用事業所となる。[R元-4ア]"}, {"id": 34, "section": "被保険者", "q": "日本国籍を有しない者であっても、法人経営である料理店で働く場合は、被保険者となる。", "correct": true, "exp": "法人の事業所は業種にかかわらず適用事業所であり、適用事業所に使用されれば国籍を問わず被保険者となる。"}, {"id": 35, "section": "被保険者", "q": "個人の事業所の事業主は、被保険者とならない。", "correct": true, "exp": "個人の事業所の事業主は「使用される者」に該当しないので被保険者にはならない。"}, {"id": 36, "section": "被保険者", "q": "1月の期間を定めて臨時に使用される者について、雇い入れた当初において当該期間を超えて引き続き使用される見込みがある場合には、初めから、一般の被保険者の資格を取得する。", "correct": true, "exp": "設問の通り正しい。見込みがある場合は初めから一般被保険者となる。"}, {"id": 37, "section": "被保険者", "q": "事業所で所在地が一定しないものに、当初から継続して6月を超える予定で使用される者は、初めから一般の被保険者となる。", "correct": false, "exp": "所在地が一定しない事業所に使用される者は、使用期間にかかわらず一般の被保険者となることはない。"}, {"id": 38, "section": "被保険者", "q": "季節的業務に使用される者であって、当初4月以内の期間の予定で使用されていたものが、業務の都合により継続して4月を超えて使用されることとなった場合は、4月を超えた日から一般の被保険者となる。", "correct": false, "exp": "設問の場合は一般の被保険者とはならない。当初から継続して4月を超える予定で使用されるものは初めから一般被保険者となる。"}, {"id": 39, "section": "被保険者", "q": "健康保険法における被保険者には、後期高齢者医療制度の被保険者が含まれている。", "correct": false, "exp": "後期高齢者医療制度の被保険者は、健康保険の被保険者から除外されている。[H21-1E]"}, {"id": 40, "section": "被保険者", "q": "「特定適用事業所」とは、事業主が同一である1又は2以上の適用事業所であって、当該1又は2以上の適用事業所に使用される特定労働者の総数が常時50人を超えるものの各適用事業所をいう。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 41, "section": "被保険者", "q": "法律によって組織された共済組合の組合員は、健康保険の適用除外とされていない。", "correct": true, "exp": "設問の通り正しい。ただし共済組合の給付が健保の給付以上の場合、健保からの給付は行われず保険料も徴収されない。"}, {"id": 42, "section": "被保険者", "q": "特定適用事業所に使用される短時間労働者で、所定労働時間が1か月の単位で定められている場合は、当該所定労働時間を4で除して得た時間を1週間の所定労働時間とすることとされている。", "correct": false, "exp": "「4」ではなく「12分の52」で除して得た時間を1週間の所定労働時間とする。"}, {"id": 43, "section": "被保険者", "q": "一般の被保険者の資格取得の日について、健康保険組合が規約をもって別段の定めをすることができる。", "correct": false, "exp": "一般の被保険者の資格取得の日について、健康保険組合が規約で別段の定めをすることはできない。"}, {"id": 44, "section": "被保険者", "q": "適用事業所に期間の定めなく採用された者について、就業規則に2か月の試用期間が定められている場合は、その間は被保険者とならず、試用期間を経過した日の翌日から被保険者となる。", "correct": false, "exp": "「試用期間を経過した日の翌日」からではなく、「適用事業所に使用されるに至った日」から被保険者となる。[H26-10D]"}, {"id": 45, "section": "被保険者", "q": "一般の被保険者は、死亡したときは、その日から被保険者の資格を喪失する。", "correct": false, "exp": "死亡したときは「その日の翌日」から被保険者の資格を喪失する。"}, {"id": 46, "section": "被保険者", "q": "60歳以上の者が、定年等による退職後に継続して再雇用される場合は、使用関係が一旦中断したものとみなし、被保険者資格喪失届及び被保険者資格取得届を提出することができる。", "correct": true, "exp": "設問の通り正しい。[H24-8C]"}, {"id": 47, "section": "被保険者", "q": "被保険者の資格の得喪は、事業主との使用関係の有無により決められるが、この使用関係の有無を判断する場合には、形式的な雇用契約の有無によって判断される。", "correct": false, "exp": "「形式的な雇用契約の有無」ではなく「事実上の使用関係の有無」によって判断される。"}, {"id": 48, "section": "任意継続被保険者等", "q": "被保険者資格喪失日の前日まで継続して2月以上任意適用事業所に使用される被保険者であった者が、任意適用事業所の取消しにより資格を喪失した場合、任意継続被保険者となることはできない。", "correct": true, "exp": "設問の通り正しい。任意適用事業所の取消しにより資格を喪失した者は任意継続被保険者になれない。"}, {"id": 49, "section": "任意継続被保険者等", "q": "任意継続被保険者は、任意継続被保険者でなくなることを希望する旨を保険者に申し出た場合においては、その申出が受理された日の翌日にその資格を喪失する。", "correct": false, "exp": "申出が受理された「日の属する月の末日が到来したときの翌日」に資格を喪失する。"}, {"id": 50, "section": "任意継続被保険者等", "q": "特例退職被保険者は、特定健康保険組合に特例退職被保険者となる旨の申出が受理された日から、その資格を取得する。", "correct": true, "exp": "設問の通り正しい。任意継続被保険者と異なり、一般の被保険者の資格を喪失した日ではない点に注意。"}, {"id": 51, "section": "任意継続被保険者等", "q": "特例退職被保険者が保険料（初めて納付すべき保険料を除く。）を、正当な理由がなく、納付期日までに納付しなかったときは、被保険者資格を喪失する。", "correct": true, "exp": "設問の通り正しい。[H21-9B]"}, {"id": 52, "section": "被扶養者", "q": "被保険者が外国に赴任している間に、赴任先で生まれた被保険者の子については、主として被保険者により生計を維持している場合には、日本国内に住所を有していないが、原則として被扶養者として認められる。", "correct": true, "exp": "設問の通り正しい。外国赴任中に生じた身分関係（出生等）は国内居住要件の例外として取り扱われる。"}, {"id": 53, "section": "被扶養者", "q": "被保険者の子で、外国において留学をする学生であるものは、主として被保険者により生計を維持している場合には、日本国内に住所を有していなくても、原則として被扶養者として認められる。", "correct": true, "exp": "設問の通り正しい。外国留学中の学生は国内居住要件の例外として取り扱われる。"}, {"id": 54, "section": "被扶養者", "q": "被保険者の姉（日本国内に住所を有するものとする。）が、被保険者と同一世帯に属していないが、主としてその被保険者により生計を維持している場合は、原則として被扶養者として認められる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 55, "section": "被扶養者", "q": "被保険者の配偶者で届出をしていないが事実上婚姻関係と同様の事情にあるものの父（日本国内に住所を有するものとする。）は、被保険者と同一の世帯に属し、かつ、主として被保険者により生計を維持している場合に、原則として、被扶養者として認められる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 56, "section": "被扶養者", "q": "被保険者の養父母（日本国内に住所を有するものとする。）が被扶養者となるには、被保険者と同一の世帯に属し、かつ、主として被保険者により生計を維持する者でなければならない。", "correct": false, "exp": "養父母は父母に該当するので、被扶養者の認定において同一世帯要件は問われない。"}, {"id": 57, "section": "被扶養者", "q": "被保険者の64歳の母（日本国内に住所を有するものとする。）が被保険者と同一世帯に属している場合、被保険者の年間収入が400万円であり、当該母の年間収入が170万円であるときには、当該母は、原則として被扶養者として認められる。", "correct": true, "exp": "60歳以上の場合は年間収入180万円未満かつ被保険者の年間収入の2分の1未満であれば原則として認定される。170万円＜180万円かつ400万円の2分の1（200万円）未満のため認定される。"}, {"id": 58, "section": "被扶養者", "q": "被保険者の父（日本国内に住所を有する者とする。）が、障害厚生年金の受給権者であり被保険者と同一世帯に属していない場合において、その年間収入が140万円あり、かつ、被保険者からの援助額が年額100万円であるときは、被扶養者として認められない。", "correct": true, "exp": "設問の通り正しい。年間収入140万円が被保険者からの援助額100万円を上回るため生計維持要件を満たさず被扶養者に該当しない。"}, {"id": 59, "section": "被扶養者", "q": "「被保険者と同一の世帯に属するもの」であることが被扶養者の要件となる場合、この者は、被保険者と住居及び家計を共同にする者をいい、同一戸籍内にあるか否かを問わず、被保険者が世帯主であることを必ずしも要しない。", "correct": true, "exp": "設問の通り正しい。[H25-5C]"}, {"id": 60, "section": "届出等", "q": "初めて適用事業所となった事業主は、当該事実のあった日から10日以内に新規の適用に関する届書を提出しなければならないが、事業の廃止等により適用事業所に該当しなくなったときの届出は、当該事実があった後、速やかに提出すればよい。", "correct": false, "exp": "どちらの届出も当該事実があった日から「5日以内」に提出しなければならない。[H24-10C]"}, {"id": 61, "section": "届出等", "q": "一般の被保険者が共済組合の組合員の資格を喪失したことにより、適用事業所に係る共済組合に関する特例の適用を受けなくなったときは、当該適用事業所の事業主は、当該事実があった日から5日以内に、届書を日本年金機構又は健康保険組合に提出しなければならない。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 62, "section": "届出等", "q": "全国健康保険協会の管掌する健康保険の被保険者又はその被扶養者が、65歳に達することにより、介護保険第2号被保険者に該当しなくなったときは、被保険者は遅滞なくその旨を事業主を経由して厚生労働大臣に届け出なければならない。", "correct": false, "exp": "65歳に達したことにより介護保険第2号被保険者に該当しなくなったときは、届け出る必要はない。[H21-7D改題]"}, {"id": 63, "section": "療養担当者", "q": "保険医療機関又は保険薬局の指定は、病院若しくは診療所又は薬局の開設者の申請に基づき、厚生労働大臣が地方社会保険医療協議会に諮問して行うものとされている。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 64, "section": "療養担当者", "q": "厚生労働大臣は、保険医療機関又は保険薬局の指定の申請があった場合において、当該申請に係る病院等の開設者又は管理者が、健康保険法等の規定により罰金の刑に処せられ、その執行を終わり、又は執行を受けることがなくなるまでの者であるとき、その指定をしないことができる。", "correct": true, "exp": "設問の通り正しい。[H20-9C]"}, {"id": 65, "section": "療養担当者", "q": "保険医療機関において診療に従事する保険医又は保険薬局において調剤に従事する保険薬剤師は、健康保険法の規定によるほか、健康保険法以外の医療保険各法又は高齢者の医療の確保に関する法律による診療又は調剤に当たるものとされている。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 66, "section": "療養担当者", "q": "厚生労働大臣は、医師若しくは歯科医師又は薬剤師から保険医又は保険薬剤師の登録の申請があった場合において、当該申請者が、健康保険法の規定により保険医又は保険薬剤師に係る登録を取り消され、その取消しの日から5年を経過しない者であるときは、地方社会保険医療協議会の議を経て、その登録をしないことができる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 67, "section": "療養担当者", "q": "保険医療機関又は保険薬局は、14日以上の予告期間を設けて、その指定を辞退することができ、保険医又は保険薬剤師は、14日以上の予告期間を設けて、その登録の抹消を求めることができる。", "correct": false, "exp": "「14日」ではなく「1月」以上の予告期間が必要。[H29-7B]"}, {"id": 68, "section": "療養担当者", "q": "診療所が医師の開設したものであり、かつ開設者である医師のみが診療に従事している場合は、当該事実をもってただちに保険医療機関の指定があったものとみなされる。", "correct": false, "exp": "設問の場合は、当該医師について保険医の登録があったときに保険医療機関の指定があったものとみなされる。[H20-9D]"}, {"id": 69, "section": "報酬・賞与", "q": "通勤手当は、自宅と勤務場所との往復にかかる交通費の実費弁償的な手当のため報酬には含まれない。", "correct": false, "exp": "通勤手当は被保険者の通常の生計費の一部に充てられているものであるから、報酬に該当する。[H24-10A]"}, {"id": 70, "section": "報酬・賞与", "q": "年4回以上支給されない通勤費（6か月ごとに支給される定期券等）は報酬の範囲に含まれるものと解される。", "correct": true, "exp": "設問の通り正しい。単に支払上の便宜によるものであるから、年4回以上支給されなくても報酬の範囲に含まれる。[H20-1C]"}, {"id": 71, "section": "報酬・賞与", "q": "出張旅費や赴任旅費などについて、事業主が負担すべきものを被保険者が立て替え、その実費弁償を受ける場合、当該費用は、報酬に該当する。", "correct": false, "exp": "実費弁償を受ける場合は労働の対償とは認められないため、報酬に該当しない。"}, {"id": 72, "section": "報酬・賞与", "q": "退職を事由に支払われる退職金であって、退職時に支払われるもの又は事業主の都合等により退職前に一時金として支払われるものについては、報酬又は賞与に該当しないものとみなされる。", "correct": true, "exp": "設問の通り正しい。なお、在職時に前払いされる場合は原則として報酬又は賞与に該当する。[H21-4E]"}, {"id": 73, "section": "報酬・賞与", "q": "健康保険法において「賞与」とは、臨時に受けるもの及び3か月を超える期間ごとに受けるものをいう。", "correct": false, "exp": "「賞与」は3か月を超える期間ごとに受けるものをいう。「臨時に受けるもの」は報酬にも賞与にも含まれない。"}, {"id": 74, "section": "報酬・賞与", "q": "報酬の全部又は一部が、通貨以外のもので支払われる場合、その価額はその地方の時価によって厚生労働大臣が算定する。", "correct": true, "exp": "設問の通り正しい。なお、健康保険組合は規約で別段の定めをすることができる。[H18-2E改題]"}, {"id": 75, "section": "標準報酬", "q": "健康保険法における標準報酬月額の等級区分は、第1級（58,000円）から第50級（1,390,000円）までとなっている。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 76, "section": "標準報酬", "q": "定時決定の対象となるのは、毎年8月1日現在使用される被保険者である。", "correct": false, "exp": "「8月1日」ではなく「7月1日」現在使用される被保険者である。"}, {"id": 77, "section": "標準報酬", "q": "随時改定、育児休業等終了時改定又は産前産後休業終了時改定により、7月から9月までのいずれかの月から標準報酬月額が改定され、又は改定されるべき被保険者については、その年の定時決定の対象から除かれる。", "correct": true, "exp": "設問の通り正しい。なお、6月1日から7月1日までの間に資格を取得した者も定時決定の対象から除かれる。"}, {"id": 78, "section": "標準報酬", "q": "賃金の計算上の締切日を毎月末日、支払日を翌月の15日としている事業所の定時決定に用いる報酬は、3月分、4月分及び5月分の賃金である。", "correct": true, "exp": "定時決定は4・5・6月に支払われた報酬を用いる。3月分は4月15日に、4月分は5月15日に、5月分は6月15日に支払われるため、これらが対象となる。[H19-2A]"}, {"id": 79, "section": "標準報酬", "q": "短時間労働者に係る定時決定について、報酬支払基礎日数が4月は10日、5月は11日、6月は13日であった場合は、6月の報酬月額をもとに標準報酬月額を決定する。", "correct": false, "exp": "報酬支払基礎日数が11日未満の月（4月）は算定対象月から除く。5月及び6月の報酬月額の平均額をもとに決定する。"}, {"id": 80, "section": "標準報酬", "q": "日、時間、出来高又は請負によって報酬が定められている者が資格を取得した場合には、当該資格を取得した月前3か月間に当該事業所で同様の業務に従事し同様の報酬を受ける者が受けた報酬の額の平均をもって、その者の標準報酬月額とする。", "correct": false, "exp": "「3か月間」ではなく「1か月間」の報酬の額の平均をもって報酬月額とする。[H21-4B]"}, {"id": 81, "section": "標準報酬", "q": "6月1日に被保険者の資格を取得した者について、資格取得時決定により決定された標準報酬月額は、原則として6月から翌年の8月までの各月の標準報酬月額とする。", "correct": true, "exp": "設問の通り正しい。6月1日から12月31日までの間に資格取得した者に適用される。"}, {"id": 82, "section": "標準報酬", "q": "7月1日に被保険者資格を取得した者については、標準報酬月額の定時決定を行わず、資格取得時に決定された標準報酬月額を、原則として翌年の6月30日までの1年間用いることになっている。", "correct": false, "exp": "翌年の「8月31日」まで用いる。[H24-3D]"}, {"id": 83, "section": "標準報酬", "q": "随時改定は、継続した3月間に受けた報酬の総額をその期間の月数で除して得た額が著しく高低を生じた場合に行われるが、各月の報酬支払基礎日数が17日以上（厚生労働省令で定める者は11日以上）でなければ行われない。", "correct": false, "exp": "設問の随時改定は、継続した3月間の各月とも17日以上（厚生労働省令で定める者は11日以上）でなければ行われない（除外規定はない）。"}, {"id": 84, "section": "標準報酬", "q": "固定的賃金は上昇したものの、超過勤務手当等の非固定的賃金が減額したために、結果的に継続した3か月間の報酬を3で除して得た額が従前の標準報酬月額の基礎となった報酬月額と比べて2等級下がった場合は、随時改定の対象となる。", "correct": false, "exp": "固定的賃金の増額・減額と実際の平均報酬月額の増額・減額が一致しない場合は、随時改定は行われない。"}, {"id": 85, "section": "標準報酬", "q": "第49級の標準報酬月額にある者の報酬月額が、固定的賃金の引上げにより算定月額が1,415,000円以上となった場合には、2等級以上の差が生じたものとして取り扱われ、随時改定の対象となる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 86, "section": "標準報酬", "q": "事業主は、被保険者が随時改定の要件に該当したときは、速やかに、健康保険被保険者報酬月額変更届を日本年金機構又は健康保険組合に提出することにより、報酬月額を届け出なければならない。", "correct": true, "exp": "設問の通り正しい。[H21-4A改題]"}, {"id": 87, "section": "標準報酬", "q": "育児休業等終了時改定は、固定的賃金に変動がなく残業手当の減少によって報酬月額が変動した場合は、その対象とならない。", "correct": false, "exp": "育児休業等終了時改定及び産前産後休業終了時改定は、固定的賃金の変動を伴う必要はなく、非固定的賃金の変動であっても対象となる。"}, {"id": 88, "section": "標準報酬", "q": "産前産後休業終了日の翌日に、育児休業等終了時改定の対象となる育児休業等を開始している被保険者は、産前産後休業終了時改定の対象とならない。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 89, "section": "標準報酬", "q": "産前産後休業終了時改定の規定によって改定された標準報酬月額は、原則として、産前産後休業終了日の翌日から起算して2月を経過した日の属する月の翌月からその年の8月（当該翌月が7月から12月までのいずれかの月である場合は、翌年の8月）までの各月の標準報酬月額とされる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 90, "section": "標準報酬", "q": "同時に2つ以上の事業所で報酬を受ける被保険者について報酬月額を算定する場合、各事業所について定時決定等の規定によって算定した額の合算額をその者の報酬月額とする。", "correct": true, "exp": "設問の通り正しい。[H24-5A]"}, {"id": 91, "section": "標準報酬", "q": "介護休業期間中の標準報酬月額は、その休業期間中に介護休業手当の支給があった場合でも、休業開始直前の標準報酬月額の算定の基礎となった報酬月額に基づき算定した額とされる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 92, "section": "標準報酬", "q": "任意継続被保険者の標準報酬月額は、原則として、当該任意継続被保険者が被保険者の資格を喪失したときの標準報酬月額、若しくは前年の3月31日における当該任意継続被保険者の属する保険者が管掌する全被保険者の同月の標準報酬月額を平均した額のうち、いずれか少ない額とする。", "correct": false, "exp": "「前年の3月31日」ではなく「前年（1月から3月までの標準報酬月額については前々年）の9月30日」が正しい。[H24-8D改題]"}, {"id": 93, "section": "標準報酬", "q": "特例退職被保険者の標準報酬月額は、その特定健康保険組合が管掌する前年の9月30日における特例退職被保険者以外の全被保険者の同月の標準報酬月額を平均した額の範囲内においてその規約で定めた額を標準報酬月額の基礎となる報酬月額とみなしたときの標準報酬月額とする。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 94, "section": "標準報酬", "q": "全国健康保険協会管掌健康保険における同一の適用事業所において、7月、11月及び翌年3月にそれぞれ200万円、300万円、100万円の賞与を受けた場合、標準賞与額は、7月200万円、11月300万円、翌年3月73万円となる。", "correct": true, "exp": "設問の通り正しい。年度の累計が573万円を超える場合は上限となるため、翌年3月は73万円となる。"}, {"id": 95, "section": "費用の負担", "q": "健康保険組合に対して交付される事務費に係る国庫負担金は、各健康保険組合の全被保険者の標準報酬月額の総額を基準として、厚生労働大臣が算定する。", "correct": false, "exp": "「標準報酬月額の総額」ではなく「被保険者数」を基準として算定する。"}, {"id": 96, "section": "費用の負担", "q": "全国健康保険協会が管掌する健康保険の任意継続被保険者に関する保険料は、厚生労働大臣が徴収する。", "correct": false, "exp": "任意継続被保険者に関する保険料は「全国健康保険協会」が徴収する。"}, {"id": 97, "section": "費用の負担", "q": "全国健康保険協会は、被保険者が介護保険第2号被保険者でない場合であっても、当該被保険者に介護保険第2号被保険者である被扶養者がある場合には、規約により、当該被保険者（特定被保険者）に介護保険料額の負担を求めることができる。", "correct": false, "exp": "特定被保険者に介護保険料額の負担を求めることができるのは「健康保険組合」のみ。全国健康保険協会はできない。[H22-3A]"}, {"id": 98, "section": "費用の負担", "q": "被保険者の保険料は月を単位として徴収され、資格取得日が月の最終日であってもその月分の保険料は徴収され、資格喪失日が月の最終日であっても原則としてその月分の保険料は徴収されない。", "correct": true, "exp": "設問の通り正しい。[H19-6A]"}, {"id": 99, "section": "費用の負担", "q": "育児休業等を開始した日の属する月とその育児休業等が終了する日の翌日が属する月が同一である場合には、当該育児休業等をした期間に係る保険料が免除されることはない。", "correct": false, "exp": "育児休業等の日数として計算した日数が14日以上である場合には、当該月の標準報酬月額に係る保険料が免除の対象となる。"}, {"id": 100, "section": "費用の負担", "q": "産前産後休業をしている一般の被保険者が使用される事業所の事業主が所定の申出をしたときは、その産前産後休業を開始した日の属する月からその産前産後休業が終了する日の翌日が属する月の前月までの期間、当該被保険者に関する保険料は徴収されない。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 101, "section": "費用の負担", "q": "全国健康保険協会が管掌する健康保険の被保険者に関する一般保険料率（都道府県単位保険料率）は、1000分の130から1000分の200までの範囲内において決定される。", "correct": false, "exp": "「1000分の30から1000分の130」までの範囲内において決定される。"}, {"id": 102, "section": "費用の負担", "q": "健康保険組合の一般保険料率の変更の決定は、厚生労働大臣の認可を受けなければならないが、一般保険料率と調整保険料率とを合算した率の変更が生じない一般保険料率の変更の決定については、変更後の一般保険料率を厚生労働大臣に届け出ることで足りる。", "correct": true, "exp": "設問の通り正しい。[H18-8C]"}, {"id": 103, "section": "費用の負担", "q": "事業主は、被保険者に対して通貨をもって賞与を支払う場合においては、被保険者の負担すべき標準賞与額に係る保険料に相当する額を当該賞与から控除することができる。", "correct": true, "exp": "設問の通り正しい。[H24-5D]"}, {"id": 104, "section": "費用の負担", "q": "事業主は、前月から引き続き被保険者である者が7月30日に退職した場合は、被保険者の負担すべき6月及び7月の標準報酬月額に係る保険料を、その者に通貨をもって支払う報酬から同時に控除することができる。", "correct": false, "exp": "7月31日が資格喪失日となるので7月分保険料は算定されない。控除できるのは6月分のみ。なお最終日退職の場合は前月及びその月分を控除できる。"}, {"id": 105, "section": "費用の負担", "q": "事業主は、その使用する被保険者に関する毎月の保険料を、その月の末日までに納付しなければならない。", "correct": false, "exp": "毎月の保険料は「翌月末日」までに納付しなければならない。任意継続被保険者は当月の10日まで。"}, {"id": 106, "section": "費用の負担", "q": "7月1日に任意継続被保険者の資格を取得した者が、8月から翌年の3月までの期間について保険料を前納しようとする場合は、前納しようとする額を8月30日までに払い込まなければならない。", "correct": false, "exp": "前納に係る保険料は前納期間の初月の前月末日までに払い込む必要がある。この場合は「7月31日」までに払い込まなければならない。"}, {"id": 107, "section": "費用の負担", "q": "保険者等は、告知をした保険料額が納付すべき保険料額を超えていることを知ったとき等は、その超えている部分に関する納入の告知又は納付を、その告知又は納付の日の翌日から1年以内の期日に納付されるべき保険料について納期を繰り上げてしたものとみなすことができる。", "correct": false, "exp": "「1年以内」ではなく「6月以内」が正しい。[H24-5C]"}, {"id": 108, "section": "費用の負担", "q": "前納された任意継続被保険者の保険料は、前納に係る期間の各月が経過した際に、それぞれその月の保険料が納付されたものとみなされる。", "correct": false, "exp": "「各月が経過したとき」ではなく「各月の初日が到来したとき」に納付されたものとみなされる。"}, {"id": 109, "section": "費用の負担", "q": "保険料等を滞納する者があるときは、保険者等は、期限を指定して、これを督促しなければならないが、督促は、口頭で行うことができる。", "correct": false, "exp": "督促は口頭では行えず、督促状を発することによって行う。"}, {"id": 110, "section": "費用の負担", "q": "全国健康保険協会又は健康保険組合が国税滞納処分の例により処分を行う場合においては、厚生労働大臣に届け出なければならない。", "correct": false, "exp": "「届け出」ではなく「厚生労働大臣の認可」を受けなければならない。"}, {"id": 111, "section": "費用の負担", "q": "適用事業所の事業主が納期限が5月31日である保険料を滞納し、指定期限を6月20日とする督促を受けたが、実際に保険料を完納したのが7月31日である場合は、原則として6月1日から7月30日までの日数によって計算された延滞金が徴収されることになる。", "correct": true, "exp": "設問の通り正しい。延滞金は納期限の翌日から徴収金完納又は財産差押えの日の前日までの期間の日数に応じて計算される。[H28-5B]"}, {"id": 112, "section": "費用の負担", "q": "保険料等を滞納した者につき督促をした場合に徴収する延滞金は、その金額に、500円未満の端数があるときは、その端数を切り捨てるものとされている。", "correct": false, "exp": "「500円未満」ではなく「100円未満」の端数を切り捨てる。"}, {"id": 113, "section": "療養の給付", "q": "療養の給付の範囲には、①診察、②薬剤又は治療材料の支給、③処置・手術その他の治療、④居宅における療養上の管理及びその療養に伴う世話その他の看護、⑤病院又は診療所への入院及びその療養に伴う世話その他の看護、⑥移送が含まれる。", "correct": false, "exp": "「⑥移送」は療養の給付の範囲に含まれない。移送費として支給される。"}, {"id": 114, "section": "療養の給付", "q": "療養の給付は、被保険者の資格取得が適正であれば、その資格取得前の疾病又は負傷に対しても被保険者として受け得る期間、給付される。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 115, "section": "療養の給付", "q": "70歳以上で標準報酬月額が28万円以上の被保険者が、70歳以上の被扶養者の分もあわせて年収が520万円未満の場合、療養の給付に係る一部負担金は申請により2割負担となる。", "correct": true, "exp": "設問の通り正しい。[H24-1E改題]"}, {"id": 116, "section": "療養の給付", "q": "保険者は、特別の事情がある被保険者に対して、①一部負担金を減額すること、②一部負担金の支払を免除すること、③保険医療機関等に対する支払に代えて一部負担金を直接に徴収することとし、その徴収を猶予すること、の措置を採ることができる。", "correct": true, "exp": "設問の通り正しい。[H23-6E]"}, {"id": 117, "section": "療養の給付", "q": "保険者は、被保険者が震災、風水害、火災等により住宅等が著しい損害を受けた場合において必要があると認めるときは、当該被保険者の申請により、6か月以上1年未満の期間を限って、一部負担金等の徴収を猶予することができる。", "correct": false, "exp": "「6か月以上1年未満」ではなく「6か月以内」の期間に限られる。[H20-2D]"}, {"id": 118, "section": "入院時食事療養費・入院時生活療養費", "q": "入院時食事療養費の額は、食事療養に要する平均的な費用の額を勘案して、中央社会保険医療協議会が定める基準により算定した費用の額から食事療養標準負担額を控除した額とする。", "correct": false, "exp": "「中央社会保険医療協議会」ではなく「厚生労働大臣」が定める基準による。[H23-6D]"}, {"id": 119, "section": "入院時食事療養費・入院時生活療養費", "q": "70歳以上であって判定基準所得がない被保険者に係る入院時食事療養費の食事療養標準負担額は、1食につき110円とされている。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 120, "section": "入院時食事療養費・入院時生活療養費", "q": "被保険者が保険医療機関から入院時食事療養費に係る療養を受けた場合、当該被保険者に支給すべき入院時食事療養費は、当該保険医療機関に支払うものとされている。", "correct": true, "exp": "設問の通り正しい。現物給付の方式で支給される。[H20-3A]"}, {"id": 121, "section": "入院時食事療養費・入院時生活療養費", "q": "60歳の被保険者が、保険医療機関の療養病床に入院した場合、入院に係る療養の給付と併せて受けた生活療養に要した費用について、入院時生活療養費が支給される。", "correct": false, "exp": "入院時生活療養費の支給対象は、療養病床に入院する65歳以上の被保険者（特定長期入院被保険者）である。60歳は対象外。[H25-5B]"}, {"id": 122, "section": "入院時食事療養費・入院時生活療養費", "q": "入院時生活療養費の支給対象となる特定長期入院被保険者とは、療養病床に入院する65歳以上の者であって、入院医療の必要性が特に高いものに限られる。", "correct": false, "exp": "「入院医療の必要性が特に高いもの」に限られない。療養病床に入院する65歳以上の者が特定長期入院被保険者となる。"}, {"id": 123, "section": "入院時食事療養費・入院時生活療養費", "q": "入院時生活療養費の支給対象となる生活療養とは、特定長期入院被保険者が自己の選定する病院又は診療所から入院たる療養の給付と併せて受けた①食事の提供である療養、及び②温度、照明及び給水に関する適切な療養環境の形成である療養のことである。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 124, "section": "保険外併用療養費", "q": "被保険者が、保険医療機関等のうち自己の選定するものから、電子資格確認等により被保険者であることの確認を受け、選定療養を受けたときは、その療養に要した費用について、保険外併用療養費が支給される。", "correct": true, "exp": "設問の通り正しい。評価療養・患者申出療養・選定療養を受けたときに支給される。"}, {"id": 125, "section": "保険外併用療養費", "q": "患者申出療養の申出は、中央社会保険医療協議会に対して行うものとする。", "correct": false, "exp": "患者申出療養の申出は「中央社会保険医療協議会」ではなく「厚生労働大臣」に対して行う。"}, {"id": 126, "section": "保険外併用療養費", "q": "厚生労働大臣が定める方法により計算した入院期間が180日を超えた日以後の入院及びその療養に伴う世話その他の看護は、選定療養とされる。", "correct": true, "exp": "設問の通り正しい。[H20-10D]"}, {"id": 127, "section": "保険外併用療養費", "q": "病床数200床以上の病院で紹介なしに受けた初診は、緊急その他やむを得ない場合も含めて、選定療養の対象にはならない。", "correct": false, "exp": "緊急その他やむを得ない場合を除き選定療養の対象となる。[H23-8E]"}, {"id": 128, "section": "保険外併用療養費", "q": "保険医療機関が表示する診療時間以外の時間における診察は、原則として保険外併用療養費に係る選定療養に該当する。", "correct": true, "exp": "設問の通り正しい。緊急やむを得ない事情による場合は選定療養に該当しない。"}, {"id": 129, "section": "保険外併用療養費", "q": "保険医療機関である病院又は診療所は、保険外併用療養に要した費用につき、被保険者から支払を受けた際、保険外併用療養に係る一部負担金相当額とその他の費用の額とを区分して記載した領収書を交付しなければならない。", "correct": true, "exp": "設問の通り正しい。[H20-10E]"}, {"id": 130, "section": "療養費", "q": "療養上必要のあるコルセットは、療養の給付として支給すべき治療材料の範囲に属するため、法第87条に基づく療養費により支給することとされている。", "correct": true, "exp": "設問の通り正しい。[H24-9A]"}, {"id": 131, "section": "療養費", "q": "手術にともない輸血を受ける場合、保存血については療養の給付として現物給付されるが、輸血の場合の血液料金は療養費として給付される。", "correct": true, "exp": "設問の通り正しい。生血を購入した場合の血液料金は療養費の支給対象となる。[H16-4B]"}, {"id": 132, "section": "療養費", "q": "海外で病気になり現地で治療を受けた場合は、療養費の支給対象とならない。", "correct": false, "exp": "海外での療養は「療養の給付等を行うことが困難であると認めるとき」に該当し、療養費の支給対象となる。"}, {"id": 133, "section": "療養費", "q": "事業主が被保険者資格取得届の提出を怠っていたため、被保険者であることが証明できない間に、被保険者が保険医療機関で診察を受けた場合には、健康保険の保険給付の対象とはならない。", "correct": false, "exp": "設問の場合は「療養の給付等を行うことが困難であると認めるとき」に該当し、療養費の支給対象となる。"}, {"id": 134, "section": "家族療養費", "q": "被扶養者が、保険医療機関等のうち自己の選定するものから療養を受けたときは、被扶養者に対し、家族療養費が支給される。", "correct": false, "exp": "家族療養費は「被扶養者」ではなく「被保険者」に対して支給される。"}, {"id": 135, "section": "家族療養費", "q": "被保険者が死亡した場合、家族療養費はその当日から支給されない。", "correct": false, "exp": "死亡日の翌日から資格喪失するため、死亡当日については家族療養費の支給は行われる。[H24-1D]"}, {"id": 136, "section": "家族療養費", "q": "被扶養者が、指定訪問看護事業者から指定訪問看護を受けたときは、家族療養費が支給される。", "correct": false, "exp": "「家族療養費」ではなく「家族訪問看護療養費」が支給される。"}, {"id": 137, "section": "家族療養費", "q": "被扶養者が6歳に達する日以後の最初の3月31日の翌日以後であって70歳に達する日の属する月以前である場合に療養（食事療養及び生活療養を除く。）を受けたときは、家族療養費の額は費用の額の100分の80である。", "correct": false, "exp": "給付割合は「100分の80」ではなく「100分の70」が正しい。"}, {"id": 138, "section": "家族療養費", "q": "68歳の被保険者で収入が520万円を超えるとき、その被扶養者で72歳の者に係る家族療養費の給付割合は70%である。", "correct": false, "exp": "被保険者が70歳未満であるため、被保険者の収入にかかわらず被扶養者に係る家族療養費の給付割合は「80%」である。[H29-8C]"}, {"id": 139, "section": "訪問看護療養費", "q": "自宅において療養している被保険者が、保険医療機関の看護師から療養上の世話を受けたときは、訪問看護療養費が支給される。", "correct": false, "exp": "保険医療機関の看護師からの場合は「療養の給付」の対象となる。訪問看護療養費は指定訪問看護事業者から指定訪問看護を受けたときに支給される。[H25-4D]"}, {"id": 140, "section": "訪問看護療養費", "q": "訪問看護療養費に係る療養上の世話又は必要な診療の補助を行う者は、医師及び歯科医師のほか、看護師、保健師、助産師、准看護師、理学療法士、作業療法士及び言語聴覚士とされている。", "correct": false, "exp": "「医師及び歯科医師」は含まれない。"}, {"id": 141, "section": "訪問看護療養費", "q": "訪問看護療養費が支給される訪問看護事業の対象者は、病状が安定し又はそれに準ずる状態にあり、かつ居宅において看護師等が行う療養上の世話及び必要な診療の補助を要すると主治の医師が認めた者に限られる。", "correct": true, "exp": "設問の通り正しい。[H21-9D]"}, {"id": 142, "section": "高額療養費", "q": "被保険者が3月15日から4月10日まで同一の医療機関で入院療養を受けた場合は、月間の高額療養費は3月15日から3月31日までの療養に係るものと、4月1日から4月10日までの療養に係るものに区分される。", "correct": true, "exp": "設問の通り正しい。月間の高額療養費は暦月1月ごとに算定する。[H24-3E改題]"}, {"id": 143, "section": "高額療養費", "q": "同一の月に同一の保険医療機関において内科及び歯科をそれぞれ通院で受診したとき、高額療養費の算定上、1つの病院で受けた療養とみなされる。", "correct": false, "exp": "内科と歯科は別個の病院で受けた療養とみなされる。[H27-3E]"}, {"id": 144, "section": "高額療養費", "q": "高額療養費の対象となる一部負担金等の額には、入院時食事療養費に係る食事療養標準負担額及び入院時生活療養費に係る生活療養標準負担額は含まれる。", "correct": false, "exp": "食事療養標準負担額及び生活療養標準負担額は高額療養費の対象となる一部負担金等の額に含まれない。"}, {"id": 145, "section": "高額療養費", "q": "標準報酬月額560,000円の被保険者（50歳）の被扶養者（45歳）が、同一の月における入院療養に係る1か月の一部負担金の額として210,000円を支払った場合、高額療養費算定基準額は84,430円である。", "correct": false, "exp": "「84,430円」ではなく「168,820円」が正しい。所得区分「53万円以上83万円未満」の算定式：167,400円+(700,000円-558,000円)×1%=168,820円。[H25-2A]"}, {"id": 146, "section": "高額療養費", "q": "標準報酬月額が53万円以上83万円未満の被保険者等が、同一月に同一病院等から受けた療養に係る一部負担金等のうち21,000円以上のものを世帯合算した額が、原則として167,400円+(医療費-558,000円)×1%を超えたとき、その超過額が高額療養費として支給される。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 147, "section": "高額療養費", "q": "70歳未満で標準報酬月額が28万円以上53万円未満の被保険者が、療養のあった月以前の12か月以内に既に高額療養費を支給された月数が3か月以上あるときは、高額療養費算定基準額が44,400円に減額される。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 148, "section": "高額療養費", "q": "高額療養費の多数回該当については、転職により健康保険組合の被保険者であった者が全国健康保険協会管掌健康保険の被保険者に変わった場合でも、高額療養費の支給回数は通算される。", "correct": false, "exp": "管掌する保険者が変わった場合には、支給回数は通算されない。[H16-4E改題]"}, {"id": 149, "section": "高額療養費", "q": "70歳未満の被保険者が、人工腎臓を実施している慢性腎不全に係る療養を受けた場合、当該療養のあった月の標準報酬月額が38万円であるときは、当該療養に係る高額療養費算定基準額は20,000円である。", "correct": false, "exp": "「20,000円」ではなく「10,000円」が正しい。標準報酬月額53万円以上の場合が20,000円となる。"}, {"id": 150, "section": "高額療養費", "q": "70歳以上の被保険者が同一の月に異なる病院等で受けた療養に係る一部負担金等の額については、21,000円に満たない場合であっても、世帯合算の対象となる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 151, "section": "高額療養費", "q": "70歳以上の一般所得者である被保険者が、ある月に外来療養を受けた場合、当該療養についての月間の高額療養費に係る高額療養費算定基準額は14,000円である。", "correct": false, "exp": "「14,000円」ではなく「18,000円」が正しい。"}, {"id": 152, "section": "高額療養費", "q": "70歳以上の被保険者又は被扶養者が長期高額疾病（特定疾病）に係る療養を受けた場合における当該療養に係る高額療養費算定基準額は、その長期高額疾病の種類や所得区分にかかわらず、10,000円である。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 153, "section": "高額介護合算療養費", "q": "高額介護合算療養費の計算期間は、毎年8月1日から翌年の7月31日までとされている。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 154, "section": "高額介護合算療養費", "q": "高額介護合算療養費は、計算期間の末日において健康保険の被保険者及びその被扶養者についてそれぞれ個別に算定し支給する。", "correct": false, "exp": "「個別に」ではなく「世帯単位で」算定し支給する。[H25-10オ]"}, {"id": 155, "section": "高額介護合算療養費", "q": "高額介護合算療養費が支給されるためには、健康保険から高額療養費、介護保険から高額介護サービス費又は高額介護予防サービス費が、いずれも支給されていることが必要である。", "correct": false, "exp": "高額療養費等が支給されていることは必要ない。[H20-2E]"}, {"id": 156, "section": "高額介護合算療養費", "q": "70歳未満で標準報酬月額が28万円以上53万円未満である被保険者に係る介護合算算定基準額は、67万円とされている。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 157, "section": "高額介護合算療養費", "q": "71歳で標準報酬月額が62万円である被保険者について、高額介護合算療養費に係る介護合算算定基準額は、67万円である。", "correct": false, "exp": "「67万円」ではなく「141万円」が正しい。"}, {"id": 158, "section": "移送費", "q": "保険外併用療養費を受けるため、病院又は診療所に移送されたとき、保険者が必要であると認めれば、移送費が支給される。", "correct": true, "exp": "設問の通り正しい。[H21-9A]"}, {"id": 159, "section": "移送費", "q": "すべての医療を私費による自由診療として受けた場合であっても、移送費の支給対象になる。", "correct": false, "exp": "私費による自由診療を受けた場合には移送費の支給対象とはならない。[H17-10C]"}, {"id": 160, "section": "移送費", "q": "移送費として支給される額は、実際に支払った額が保険者が算定した額から3割の一部負担を差し引いた額よりも低い場合には全額が移送費として支払われる。", "correct": false, "exp": "移送費には定率の一部負担はない。[H21-7C]"}, {"id": 161, "section": "移送費", "q": "移送費は、通院など緊急的、一時的とは認められないときは支給されない。", "correct": true, "exp": "設問の通り正しい。[H17-10A]"}, {"id": 162, "section": "移送費", "q": "移送費は、医学的管理が必要であったと医師が判断する場合に限り、医師、看護師等付添人について、原則として1人までの交通費も対象となる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 163, "section": "移送費", "q": "被保険者が移送費の支給を受けようとするときは、申請書に、移送に要した費用の額を証する書類、医師又は歯科医師の意見書等を添付して、保険者に提出しなければならない。", "correct": true, "exp": "設問の通り正しい。[H23-9E]"}, {"id": 164, "section": "傷病手当金", "q": "傷病手当金は、療養のため労務に服することができないときに支給されるが、その場合の療養は保険給付として受ける療養に限らず、自費診療で受けた療養、自宅での療養や病後の静養についても該当し、傷病手当金は支給される。", "correct": true, "exp": "設問の通り正しい。ただし療養の給付の対象とならない疾病等（美容整形等）は対象外。[H23-9A]"}, {"id": 165, "section": "傷病手当金", "q": "傷病手当金の支給要件である労務不能の判定は、医学的基準のみによって厳密に判断すべきものとされており、医師の判断に基づき、保険者が認定する。", "correct": false, "exp": "医学的基準のみで行わなければならないものではなく、その被保険者の従事する業務の種別等を考えて、社会通念に基づき保険者が認定する。"}, {"id": 166, "section": "傷病手当金", "q": "被保険者がその本来の職場における労務に就くことが不可能な場合であっても、傷病手当金の支給があるまでの間、一時的に軽微な他の労務に服することにより、賃金を得るような場合には、労務不能に該当しないため傷病手当金は支給されない。", "correct": false, "exp": "本来の職場における労務に対する代替的性格をもたない副業・内職等の場合や一時的に軽微な他の労務に服する場合は、労務不能に該当し傷病手当金が支給される。"}, {"id": 167, "section": "傷病手当金", "q": "療養のため労務に服することができない期間に、その使用される事業所の公休日がある場合は、その日についても傷病手当金は支給される。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 168, "section": "傷病手当金", "q": "傷病手当金の支給を受けている被保険者が死亡した場合、死亡日当日は傷病手当金は支給されない。", "correct": false, "exp": "死亡日当日はなお被保険者の資格があるので、その日の傷病手当金は支給される。"}, {"id": 169, "section": "傷病手当金", "q": "傷病手当金の待期期間は、最初に療養のため労務不能となった場合のみ適用され、その後労務に服し同じ疾病又は負傷につきさらに労務不能になった場合は待期の適用は行われない。", "correct": true, "exp": "設問の通り正しい。[H21-6B]"}, {"id": 170, "section": "傷病手当金", "q": "被保険者が就業中の午後4時頃になって虫垂炎を発症し、そのまま入院した場合、その翌日が傷病手当金の待期期間の起算日となる。", "correct": false, "exp": "就業時間中に労務不能になった場合は「入院の日」が待期期間の起算日となる。翌日ではない。[H28-3C]"}, {"id": 171, "section": "傷病手当金", "q": "療養のため欠勤した場合において、この欠勤開始の日から継続した3日間を年次有給休暇として処理した場合でも、傷病手当金の支給に係る待期が完成したものとされ、療養のため欠勤した日の第4日目から傷病手当金が支給される。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 172, "section": "傷病手当金", "q": "傷病手当金の額は、原則として、1日につき、直近の継続した12月間の各月の標準報酬月額を平均した額の30分の1に相当する額の100分の60に相当する金額である。", "correct": false, "exp": "「100分の60」ではなく「3分の2」が正しい。"}, {"id": 173, "section": "傷病手当金", "q": "傷病手当金の受給中に出産手当金が支払われるときは、傷病手当金の支給が優先され、その期間中は出産手当金の支給は停止される。", "correct": false, "exp": "「出産手当金」の支給が優先され、「傷病手当金」の支給が原則停止される。[H24-3A]"}, {"id": 174, "section": "傷病手当金", "q": "傷病手当金の支給を受けるべき者が、同一の疾病又は負傷に関し、厚生年金保険法による障害厚生年金の支給を受けることができるときは調整が行われるが、障害手当金の支給を受けることができるときは調整は行われない。", "correct": false, "exp": "障害手当金の支給を受けることができる場合についても、傷病手当金の支給調整が行われる。"}, {"id": 175, "section": "傷病手当金", "q": "労働者災害補償保険法に基づく休業補償給付を受給している健康保険の被保険者が、さらに業務外の事由による傷病によって労務不能の状態になった場合には、それぞれが別の保険事故であるため、休業補償給付及び傷病手当金は、それぞれ全額支給される。", "correct": false, "exp": "休業補償給付の額が傷病手当金の額に達しないときにおけるその差額部分を除き、傷病手当金は支給されない。[H24-10E]"}, {"id": 176, "section": "傷病手当金", "q": "傷病手当金の支給要件に該当すると認められる者が介護休業をしている場合、当該休業期間中については、原則として傷病手当金が支給される。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 177, "section": "傷病手当金", "q": "傷病手当金の支給期間は、同一の疾病又は負傷及びこれにより発した疾病に関しては、療養により労務に服することができなくなった日から通算して1年6月間とする。", "correct": false, "exp": "「療養により労務に服することができなくなった日から」ではなく「その支給を始めた日から」通算して1年6月間とする。"}, {"id": 178, "section": "傷病手当金", "q": "就労したために傷病手当金が支給されなかった日は、同一の疾病又は負傷に関する傷病手当金の支給期間である1年6月間に含まれる。", "correct": false, "exp": "就労により不支給となった日はこの累積日数には算入されない。"}, {"id": 179, "section": "出産育児一時金", "q": "出産育児一時金は、妊娠85日以後の出産であれば、生産、死産、流産（人工妊娠中絶を含む。）又は早産を問わず、支給される。", "correct": true, "exp": "設問の通り正しい。妊娠4月（85日）以上の出産であれば給付される。"}, {"id": 180, "section": "出産育児一時金", "q": "出産育児一時金の額は、一定の要件に該当する出産であると保険者が認めるときは、48万8千円に3万円を超えない範囲内で保険者が定める金額が加算される。現在、出産育児一時金として支給される額は、両方を合わせると50万円となる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 181, "section": "出産育児一時金", "q": "出産育児一時金の額に加算されるためには、①産科医療補償制度に加入する医療機関等による医学的管理の下における出産であること、及び②在胎週数が22週に達した日以後の出産（死産を含む。）であること、のいずれにも該当していることが必要である。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 182, "section": "出産育児一時金", "q": "多胎妊娠による出産の場合、出産育児一時金又は家族出産育児一時金は、第二子以降は第一子の額の80%が支給される。", "correct": false, "exp": "第二子以降も第一子と同額が支給される。[H19-5C改題]"}, {"id": 183, "section": "出産手当金", "q": "出産手当金の支給において、出産日当日は、産後に含まれる。", "correct": false, "exp": "出産日当日は「産前」に含まれる。"}, {"id": 184, "section": "出産手当金", "q": "被保険者が出産予定日の42日前から出産休暇をとったところ、予定日より5日遅れて出産した場合、出産日以前の出産手当金の支給日数は47日となり、また、5日の超過日数が出産日後の56日から差し引かれることはない。", "correct": true, "exp": "設問の通り正しい。出産が遅れた場合はその期間も支給され、産後56日には影響しない。[H18-4C]"}, {"id": 185, "section": "出産手当金", "q": "被保険者（任意継続被保険者を除く。）が出産したときは、出産の日（出産の日が出産の予定日後であるときは、出産の予定日）以前42日（多胎妊娠の場合は98日）から出産の日後56日までの間において労務に服さなかった期間、出産手当金として、一日につき直近12月間の標準報酬月額の平均額の30分の1相当額の3分の2に相当する金額が支給される。", "correct": true, "exp": "設問の通り正しい。[H24-7A改題]"}, {"id": 186, "section": "出産手当金", "q": "出産手当金は、その被保険者の従事する業務に堪え得るか否かとは関係なく、労務に服さなかった期間について支給される。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 187, "section": "出産手当金", "q": "出産手当金の支給を受けられる期間について、報酬の全部又は一部を受けることができる場合であっても、出産手当金は、調整の対象とならず、その全額を支給する。", "correct": false, "exp": "報酬を受けることができる期間は出産手当金は支給されず、報酬の額が出産手当金の額を下回るときはその差額を支給する。"}, {"id": 188, "section": "埋葬料・埋葬費", "q": "埋葬料の支給対象にある「その者により生計を維持していた者」とは、被保険者により生計の全部若しくは大部分を維持していた者に限られず、生計の一部分を維持していた者も含まれる。", "correct": true, "exp": "設問の通り正しい。[H24-10D]"}, {"id": 189, "section": "埋葬料・埋葬費", "q": "被保険者の死亡により支給される埋葬料は、被保険者の標準報酬月額に相当する金額である。", "correct": false, "exp": "埋葬料の額は「5万円」の定額である。[H19-9B]"}, {"id": 190, "section": "埋葬料・埋葬費", "q": "被保険者が死亡し社葬を行った場合には、たとえその被保険者に配偶者がいたとしても、配偶者には埋葬料は支給されない。", "correct": false, "exp": "「埋葬を行う者」とは社会通念上埋葬を行うべき者をいう。配偶者が生計を維持されていた場合は配偶者が支給対象となる。[H25-7A]"}, {"id": 191, "section": "埋葬料・埋葬費", "q": "被保険者が死亡したときは、その者により生計を維持していた者であって埋葬を行うものに対して埋葬料を支給するが、埋葬料の支給を受けるべき者がない場合においては、埋葬を行った者に対して埋葬料の金額の範囲内においてその埋葬に要した費用に相当する金額を支給する。", "correct": true, "exp": "設問の通り正しい。[H23-4B]"}, {"id": 192, "section": "埋葬料・埋葬費", "q": "被保険者が死産児を出産した場合、出産育児一時金及び家族埋葬料が支給される。", "correct": false, "exp": "死産児は被扶養者に該当しないので「家族埋葬料」は支給されない。出産育児一時金は妊娠4月以上であれば死産でも支給される。[H21-5D]"}, {"id": 193, "section": "資格喪失後の給付", "q": "被保険者の資格を喪失した日の前日まで引き続き1年以上被保険者であった者が、療養のため労務に服していなかったが、在職中は報酬を受けていたため傷病手当金の支給を停止されていた場合、退職して報酬の支払いがなくなったとしても、傷病手当金の支給を受けることはできない。", "correct": false, "exp": "傷病手当金の受給が可能な状態にある者が報酬を受けているため一時支給停止されているときに資格喪失した場合も、資格喪失後の傷病手当金を受給できる。"}, {"id": 194, "section": "資格喪失後の給付", "q": "被保険者の資格喪失後継続して傷病手当金の支給を受けるには、被保険者期間は同一の保険者でなければならない。", "correct": false, "exp": "必ずしも同一の保険者でなくてもよい。被保険者としての資格が連続していればよい。"}, {"id": 195, "section": "資格喪失後の給付", "q": "1年以上の継続した被保険者期間を有する者であって、出産予定日から起算して40日前の日に退職した者が、退職日において通常勤務していた場合、退職日の翌日から資格喪失後の出産手当金を受けることができる。", "correct": false, "exp": "退職日において通常勤務しているので、資格喪失の際に出産手当金を受けている状態にはなく、資格喪失後の出産手当金を受けることはできない。"}, {"id": 196, "section": "資格喪失後の給付", "q": "傷病手当金の継続給付は、被保険者の資格を喪失した日から通算して1年6月間支給される。", "correct": false, "exp": "「資格を喪失した日から通算して」ではなく「被保険者として受けることができるはずであった期間」（支給を始めた日から通算して1年6月間）支給される。"}, {"id": 197, "section": "資格喪失後の給付", "q": "資格喪失後、継続給付としての傷病手当金の支給を受けている者について、一旦稼働して当該傷病手当金が不支給となったとしても、完全治癒していなければ、その後更に労務不能となった場合、当該傷病手当金の支給が復活する。", "correct": false, "exp": "資格喪失後の継続給付としての傷病手当金は「継続して」受けることができる。一旦不支給となると復活しない。[R元-5E]"}, {"id": 198, "section": "資格喪失後の給付", "q": "被保険者の資格を喪失した日の前日まで引き続き1年以上被保険者であった者が被保険者の資格を喪失した日後8月以内に出産したときは、資格喪失後の出産育児一時金を受けることができる。", "correct": false, "exp": "「8月以内」ではなく「6月以内」が正しい。"}, {"id": 199, "section": "資格喪失後の給付", "q": "被保険者が資格を喪失した日後6月以内に、その者により生計を維持する配偶者が出産した場合は、一定の要件に該当するときに限り、家族出産育児一時金が支給される。", "correct": false, "exp": "被保険者の資格喪失後に家族出産育児一時金は支給されない。"}, {"id": 200, "section": "資格喪失後の給付", "q": "被保険者の資格を喪失した日の前日まで引き続き1年以上被保険者であった者がその資格を喪失した日後6月以内に出産した場合であっても、夫の被扶養者となっているときには、資格喪失後の出産育児一時金は支給されず、家族出産育児一時金が支給される。", "correct": false, "exp": "請求者の選択により、本人としての出産育児一時金又は被扶養者としての家族出産育児一時金のいずれかを受給することとなる。"}, {"id": 201, "section": "資格喪失後の給付", "q": "被保険者の資格を喪失した後に出産手当金の継続給付を受けていた者がその給付を受けなくなった日後6か月以内に死亡したとき、被保険者であった者により生計を維持していた者であって埋葬を行うものは、埋葬料として5万円が支給される。", "correct": false, "exp": "「6か月以内」ではなく「3か月以内」が正しい。[H22-3B]"}, {"id": 202, "section": "資格喪失後の給付", "q": "被保険者の資格喪失後継続して出産手当金の支給を受けていた者が船員保険の被保険者になったときは、その継続給付は行われなくなる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 203, "section": "給付通則", "q": "保険給付を受ける権利は、健康保険法上、必要と認める場合には、譲渡や担保に供したり又は差し押さえることができる。", "correct": false, "exp": "保険給付を受ける権利は、譲り渡し、担保に供し、又は差し押さえることができない。例外は設けられていない。[H24-7D]"}, {"id": 204, "section": "給付通則", "q": "傷病手当金及び出産手当金は、課税対象となる収入には含まれない。", "correct": true, "exp": "設問の通り正しい。保険給付として支給を受けた金品を標準として租税その他の公課を課することはできない。"}, {"id": 205, "section": "給付通則", "q": "給付事由が第三者の行為によって生じた場合において、保険給付を受ける権利を有する者が第三者から同一の事由について損害賠償を受けたときは、保険者は、その価額の限度において、保険給付を行う責めを免れる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 206, "section": "給付通則", "q": "自動車事故にあった被保険者に対して傷病手当金の支給をする前に、加害者が当該被保険者に対して負傷による休業に対する賠償をした場合、保険者はその損害賠償の価額の限度内で、傷病手当金の支給を行う責めを免れる。", "correct": true, "exp": "設問の通り正しい。[H21-6E]"}, {"id": 207, "section": "給付通則", "q": "保険者は、偽りその他不正の行為によって保険給付を受けた者があるときは、その者からその給付の価額の全部又は一部を徴収することができる。", "correct": true, "exp": "設問の通り正しい。[H23-3D]"}, {"id": 208, "section": "給付通則", "q": "妊娠4か月を過ぎてから業務上の事故により流産し、労災保険法の療養補償給付を受けた場合、健康保険から出産育児一時金の支給は行われない。", "correct": false, "exp": "労災保険法の療養補償給付の支給を受けたか否かを問わず、妊娠4か月以上の出産であれば出産育児一時金が支給される。[H26-2D]"}, {"id": 209, "section": "給付通則", "q": "健康保険の被保険者が通勤途上負傷し、労災保険の保険給付を受けることができるときは、その負傷について健康保険からの保険給付は行われず、その者が勤務する事業所が労災保険の任意適用事業所で労災保険に未加入であった場合にも、同様に健康保険からの保険給付は行われない。", "correct": false, "exp": "労災保険に未加入の任意適用事業所での通勤災害については、原則として健康保険で保険給付を行う。[H26-4B]"}, {"id": 210, "section": "給付通則", "q": "被保険者が故意に給付事由を生じさせたときは保険給付は行われないため、自殺により死亡した場合の埋葬料は支給されない。", "correct": false, "exp": "自殺による死亡は故意に基づく事故ではあるが、埋葬料は被保険者により生計を維持していた者に対して支給されるという性質から、故意に基づく給付事由と取り扱われず、埋葬料は支給される。[H23-2A]"}, {"id": 211, "section": "給付通則", "q": "非常災害の場合に、災害救助法が発動され、負傷した被保険者に対して同法の規定に基づき都道府県から応急的な医療が行われた場合には、その限度において健康保険の保険給付は行われない。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 212, "section": "給付通則", "q": "被保険者が道路交通法違反である無免許運転により起こした事故のため死亡した場合には、所定の要件を満たす者に埋葬料が支給される。", "correct": true, "exp": "設問の通り正しい。自殺の場合にならい埋葬料を支給して差し支えない。[R2-6E]"}, {"id": 213, "section": "給付通則", "q": "被保険者が闘争、泥酔又は著しい不行跡によって給付事由を生じさせたときは、当該給付事由に係る保険給付は行わない。", "correct": false, "exp": "「行わない」ではなく「全部又は一部を行わないことができる」が正しい。"}, {"id": 214, "section": "給付通則", "q": "保険者は、偽りその他不正の行為により療養の給付を受け、又は受けようとした者に対して、6か月以内の期間を定め、その者に支給すべき療養の給付の全部又は一部を支給しない旨の決定をすることができる。", "correct": false, "exp": "設問の給付制限の対象となるのは「療養の給付」ではなく「傷病手当金又は出産手当金」である。[H21-10B]"}, {"id": 215, "section": "給付通則", "q": "保険者は、被保険者が少年院その他これに準ずる施設に収容されたときには、疾病、負傷又は出産につき、その期間に係る保険給付（傷病手当金及び出産手当金の支給にあっては、厚生労働省令で定める場合に限る。）を行わないが、被扶養者に係る保険給付を行うことは妨げられない。", "correct": true, "exp": "設問の通り正しい。[H26-8C]"}, {"id": 216, "section": "日雇特例被保険者", "q": "日雇特例被保険者の保険の保険者は、全国健康保険協会及び健康保険組合である。", "correct": false, "exp": "日雇特例被保険者の保険の保険者は「全国健康保険協会」のみである。"}, {"id": 217, "section": "日雇特例被保険者", "q": "日雇労働者が、適用事業所において、引き続く2月間に通算して26日以上又は引き続く6月間に通算して78日以上使用される見込みのないことが明らかである場合は、厚生労働大臣の承認を受けて、日雇特例被保険者とならないことができる。", "correct": false, "exp": "「引き続く2月間に通算して26日以上」の場合の規定はあるが、「引き続く6月間に通算して78日以上」の場合の規定はない。"}, {"id": 218, "section": "日雇特例被保険者", "q": "日雇特例被保険者を使用する事業主は、日雇特例被保険者に賃金を支払う都度、その者及び自己の負担すべきその日の標準賃金日額に係る保険料を納付すべき義務を負う。", "correct": false, "exp": "「賃金を支払う都度」ではなく「日雇特例被保険者を使用する日ごと」に納付する義務を負う。"}, {"id": 219, "section": "日雇特例被保険者", "q": "厚生労働大臣は、日雇特例被保険者に係る健康保険事業に要する費用に充てるため、保険料のほかに、日雇関係組合から日雇拠出金を徴収する。", "correct": true, "exp": "設問の通り正しい。[H19-7D改題]"}, {"id": 220, "section": "日雇特例被保険者", "q": "日雇特例被保険者の療養の給付期間は、同一の疾病又は負傷に対し、原則として、療養の給付等開始日から1年間（ただし、結核性疾病の場合は3年間）である。", "correct": false, "exp": "結核性疾病の場合は「3年間」ではなく「5年間」が正しい。"}, {"id": 221, "section": "日雇特例被保険者", "q": "初めて日雇特例被保険者手帳の交付を受けた者に対する特別療養費の支給期間は、日雇特例被保険者手帳の交付を受けた日の属する月の初日から起算して3か月間（月の初日に日雇特例被保険者手帳の交付を受けた者については2か月間）である。", "correct": true, "exp": "設問の通り正しい。[H26-2A]"}, {"id": 222, "section": "日雇特例被保険者", "q": "日雇特例被保険者に係る傷病手当金の支給に当たっては、労務不能となった際にその原因となった傷病について療養の給付を受けていれば、労務不能期間において当該傷病につき療養の給付を受けていることを要しないものとされている。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 223, "section": "時効・不服申立て等", "q": "療養費を受ける権利は、療養に要した費用を支払った日から5年を経過したときは、時効によって消滅する。", "correct": false, "exp": "療養費の消滅時効は「療養に要した費用を支払った日の翌日から2年」である。[H24-1B]"}, {"id": 224, "section": "時効・不服申立て等", "q": "傷病手当金を受ける権利の消滅時効は2年であるが、その起算日は労務不能であった日ごとにその翌日である。", "correct": true, "exp": "設問の通り正しい。[H27-9D]"}, {"id": 225, "section": "時効・不服申立て等", "q": "出産手当金を受ける権利は、出産の日の翌日から2年ですべて消滅する。", "correct": false, "exp": "「労務に服さなかった日ごとにその翌日から起算して」2年で消滅する。"}, {"id": 226, "section": "時効・不服申立て等", "q": "事業主は、健康保険に関する書類をその完結の日から3年間保存しなければならない。", "correct": false, "exp": "「3年間」ではなく「2年間」保存しなければならない。"}, {"id": 227, "section": "時効・不服申立て等", "q": "事業主が、正当な理由がなくて被保険者の資格の取得若しくは喪失又は報酬月額若しくは賞与額に関する事項を保険者等に届け出なかったときは、6月以下の懲役又は50万円以下の罰金に処せられる。", "correct": true, "exp": "設問の通り正しい。"}, {"id": 228, "section": "時効・不服申立て等", "q": "社会保険審査官に対する審査請求の対象になる事項は、被保険者の資格、標準報酬、保険給付、保険料その他の徴収金の賦課・徴収又は滞納に関する処分である。", "correct": false, "exp": "保険料その他の徴収金の賦課・徴収又は滞納に関する処分は「社会保険審査会」に対する審査請求の対象である。[H18-10B]"}, {"id": 229, "section": "時効・不服申立て等", "q": "保険料等の賦課若しくは徴収の処分又は滞納処分に不服がある者は、社会保険審査会に対して審査請求をすることができるが、その審査請求は、原則として、処分があったことを知った日の翌日から起算して2月を経過したときは、することができない。", "correct": false, "exp": "「2月」ではなく「3月」が正しい。"}, {"id": 230, "section": "時効・不服申立て等", "q": "被保険者の資格に関する処分が確定したときは、その処分についての不服を当該処分に基づく保険給付に関する処分についての不服の理由とすることはできない。", "correct": true, "exp": "設問の通り正しい。"}];

let queue = [];
let currentIdx = 0;
let results = {}; // id -> 'correct'|'wrong'
let bookmarks = new Set(JSON.parse(localStorage.getItem('hk_bookmarks')||'[]'));
let mode = 'all';
let sectionFilter = '';

function applyFilter() {
  sectionFilter = document.getElementById('section-select').value;
  restart();
}

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  restart();
}

function buildQueue() {
  let filtered = ALL.filter(q => !sectionFilter || q.section === sectionFilter);
  if (mode === 'wrong') filtered = filtered.filter(q => results[q.id] === 'wrong');
  if (mode === 'bookmark') filtered = filtered.filter(q => bookmarks.has(q.id));
  // シャッフル
  for (let i = filtered.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
  }
  return filtered;
}

function restart() {
  results = {};
  queue = buildQueue();
  currentIdx = 0;
  document.getElementById('complete-view').classList.remove('show');
  document.getElementById('question-area').style.display = '';
  updateStats();
  render();
}

function render() {
  if (currentIdx >= queue.length) {
    showComplete();
    return;
  }

  const q = queue[currentIdx];
  const pct = Math.round(currentIdx / queue.length * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  updateStats();

  const isBookmarked = bookmarks.has(q.id);
  const area = document.getElementById('question-area');

  area.innerHTML = `
    <div class="card">
      <div class="bookmark-row">
        <button class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark(${q.id}, this)" title="しおり">
          ${isBookmarked ? '★' : '☆'}
        </button>
      </div>
      <div class="card-header">
        <span class="card-num">問 ${q.id} / ${queue.length > 1 ? currentIdx+1+'/'+queue.length : ''}</span>
        <span class="section-tag">${q.section}</span>
      </div>
      <div class="question-text">${q.q}</div>
      <div class="answer-btns">
        <button class="ans-btn" data-val="true" onclick="answer(true)">○</button>
        <button class="ans-btn" data-val="false" onclick="answer(false)">×</button>
      </div>
      <div class="result-box" id="result-box"></div>
      <div class="nav-btns" id="nav-btns" style="display:none">
        <button class="nav-btn btn-prev" onclick="prev()">← 前</button>
        <button class="nav-btn btn-next" onclick="next()">次の問題 →</button>
      </div>
    </div>
  `;
}

function answer(userAnswer) {
  const q = queue[currentIdx];
  const isCorrect = (userAnswer === q.correct);
  results[q.id] = isCorrect ? 'correct' : 'wrong';

  // ボタン表示
  document.querySelectorAll('.ans-btn').forEach(btn => {
    btn.disabled = true;
    const val = btn.dataset.val === 'true';
    if (val === q.correct) btn.classList.add('correct');
    else if (val === userAnswer && !isCorrect) btn.classList.add('wrong');
  });

  // 解説
  const box = document.getElementById('result-box');
  box.className = 'result-box show ' + (isCorrect ? 'correct' : 'wrong');
  box.innerHTML = `
    <div class="result-label">${isCorrect ? '✓ 正解！' : '✗ 不正解'}</div>
    <div class="result-answer">正解：${q.correct ? '○（正しい）' : '×（誤り）'}</div>
    <div class="explanation-text">${q.exp}</div>
  `;

  document.getElementById('nav-btns').style.display = 'flex';
  updateStats();

  // ヘッダースコア
  const correct = Object.values(results).filter(v => v === 'correct').length;
  const total = Object.keys(results).length;
  document.getElementById('hdr-score').textContent = `○ ${correct} / ${total}`;
}

function next() {
  currentIdx++;
  render();
}

function prev() {
  if (currentIdx > 0) {
    currentIdx--;
    render();
  }
}

function toggleBookmark(id, btn) {
  if (bookmarks.has(id)) {
    bookmarks.delete(id);
    btn.textContent = '☆';
    btn.classList.remove('active');
  } else {
    bookmarks.add(id);
    btn.textContent = '★';
    btn.classList.add('active');
  }
  localStorage.setItem('hk_bookmarks', JSON.stringify([...bookmarks]));
}

function updateStats() {
  const correct = Object.values(results).filter(v => v === 'correct').length;
  const wrong = Object.values(results).filter(v => v === 'wrong').length;
  const remain = queue.length - currentIdx;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-remain').textContent = remain;
}

function showComplete() {
  document.getElementById('question-area').style.display = 'none';
  document.getElementById('complete-view').classList.add('show');
  const correct = Object.values(results).filter(v => v === 'correct').length;
  const total = queue.length;
  const pct = Math.round(correct/total*100);
  document.getElementById('cmp-score').textContent = `${correct} / ${total}`;
  document.getElementById('cmp-pct').textContent = `正答率 ${pct}%`;
  document.getElementById('prog-fill').style.width = '100%';
}

// 初期化
restart();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/Kenpo-training/sw.js');
  });
}
</script>
