<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社労士 一問一答</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="社労士">
<link rel="apple-touch-icon" href="samune.png">
<meta name="theme-color" content="#0a0a0f">
</head>
<body>

<header>
  <div class="header-left">
    <button id="back-btn" class="back-btn" onclick="goHome()" style="display:none">←</button>
    <div class="header-title" id="header-title">社労士 一問一答</div>
  </div>
  <div class="header-right">
    <div class="score-badge" id="hdr-score" style="display:none">○ 0 / 0</div>
  </div>
</header>
<div class="progress-bar">
  <div class="progress-fill" id="prog-fill" style="width:0%"></div>
</div>

<main>

  <div id="home-view">
    <div id="home-summary" class="home-summary"></div>
    <div class="home-intro">科目を選んでください（全<span id="home-total"></span>問）</div>
    <div class="home-grid" id="home-grid"></div>
    <div class="home-footer">
      <button class="link-btn" onclick="resetAllStats()">学習記録をリセット</button>
    </div>
  </div>

  <div id="quiz-view" style="display:none">
    <div class="filter-bar" id="filter-bar">
      <span class="filter-label">章：</span>
      <select class="filter-select" id="section-select" onchange="applyFilter()">
        <option value="">全章</option>
      </select>
      <div class="mode-btns">
        <button class="mode-btn active" data-mode="all" onclick="setMode('all',this)">全問</button>
        <button class="mode-btn" data-mode="unseen" onclick="setMode('unseen',this)">未</button>
        <button class="mode-btn" data-mode="wrong" onclick="setMode('wrong',this)">誤問</button>
        <button class="mode-btn" data-mode="bookmark" onclick="setMode('bookmark',this)">☆</button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat"><div class="dot dot-correct"></div>正解 <strong id="stat-correct">0</strong></div>
      <div class="stat"><div class="dot dot-wrong"></div>不正解 <strong id="stat-wrong">0</strong></div>
      <div class="stat"><div class="dot dot-skip"></div>残り <strong id="stat-remain">0</strong></div>
    </div>

    <div id="question-area"></div>
    <div id="complete-view">
      <div class="complete-score" id="cmp-score"></div>
      <div class="complete-label">問中正解</div>
      <div class="complete-pct" id="cmp-pct"></div>
      <div class="nav-btns complete-btns">
        <button class="nav-btn btn-wrong" id="cmp-review-btn" onclick="reviewWrongNow()" style="display:none">誤問を復習</button>
        <button class="nav-btn btn-next" onclick="restart()">もう一度</button>
        <button class="nav-btn btn-prev" onclick="goHome()">科目一覧へ</button>
      </div>
    </div>

    <div class="home-footer" id="reset-row">
      <button class="link-btn" onclick="resetSubjectStats()">この科目の学習記録をリセット</button>
    </div>
  </div>

</main>

<script src="app.js"></script>
</body>
</html>
